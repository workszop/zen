<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Personal Zen</title>

    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Zen" />
    <meta name="theme-color" content="#fbfaf8" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Licorice&display=swap">
    <script defer src="https://cdn.jsdelivr.net/npm/lucide@1.41.0/dist/umd/lucide.min.js"></script>
    <style>
        /* ─── Tokens ─────────────────────────────── */
        :root {
            --bg: #fbfaf8;
            --surface: #ffffff;
            --ink: #17161a;
            --muted: #6f6a63;
            --line: #e7e3dc;
            --accent: #17161a;
            --focus: rgba(23, 22, 26, 0.08);
            --backdrop: rgba(23, 22, 26, 0.35);
            --font-body: "DM Sans", system-ui, sans-serif;
            --font-display: "DM Serif Display", Georgia, serif;
            --font-answer: "Licorice", cursive;
            --answer-style: italic;
            --answer-weight: 400;
            --answer-size: 36px;
            --answer-line-height: 48px;
            --answer-align: left;
            --answer-writing-seconds-max: 24;
            --answer-characters-per-second: 20;
            --font-controls-size: 12px;
            --icon-size: 22px;
            --mode-icon-size: 32px;
            --title-size: 26px;
            --question-size: 22px;
            --input-size: 16px;
            --touch-size: 44px;
            --bamboo-height: 280px;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
        }

        /* ─── Layout ─────────────────────────────── */
        .page {
            flex: 1;
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 24px 72px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .topbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: var(--title-size);
            font-weight: 400;
            letter-spacing: -0.3px;
            margin: 0;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ─── Controls ───────────────────────────── */
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: var(--touch-size);
            min-height: var(--touch-size);
            gap: 6px;
            padding: 7px 10px;
            border: 1px solid transparent;
            border-radius: 999px;
            background: none;
            color: var(--muted);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .icon-btn:hover {
            color: var(--ink);
            border-color: var(--line);
        }

        .icon-btn .lucide {
            width: var(--icon-size);
            height: var(--icon-size);
            stroke-width: 1.5;
            flex-shrink: 0;
        }

        .modes {
            display: flex;
            gap: 18px;
            margin-top: 24px;
            font-size: 13px;
        }

        .mode-btn {
            display: inline-flex;
            align-items: center;
            min-height: var(--touch-size);
            gap: 6px;
            padding: 0 0 4px;
            border: 0;
            border-bottom: 1px solid transparent;
            background: none;
            color: var(--muted);
            font: inherit;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .mode-btn .mode-icon {
            width: var(--mode-icon-size);
            height: var(--mode-icon-size);
            stroke-width: 1.1;
            flex-shrink: 0;
        }

        .mode-btn:hover {
            color: var(--ink);
        }

        .mode-btn[aria-pressed="true"] {
            color: var(--ink);
            border-bottom-color: var(--ink);
        }

        .ask {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 10px;
            transition: border-color 0.18s ease;
        }

        .ask:focus-within {
            border-bottom-color: var(--ink);
        }

        .ask input {
            flex: 1;
            border: 0;
            background: none;
            font-family: var(--font-display);
            font-size: var(--question-size);
            color: var(--ink);
            outline: none;
            min-width: 0;
            min-height: var(--touch-size);
        }

        .ask input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }

        .ask button {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: var(--touch-size);
            height: var(--touch-size);
            border: 1px solid var(--line);
            border-radius: 999px;
            background: none;
            color: var(--ink);
            cursor: pointer;
            transition: 0.18s ease;
        }

        .ask button:hover {
            background: var(--accent);
            color: var(--surface);
            border-color: var(--accent);
        }

        .ask button .lucide {
            width: var(--icon-size);
            height: var(--icon-size);
            stroke-width: 1.5;
        }

        /* ─── Canvas ─────────────────────────────── */
        .canvas-wrap {
            display: none;
            width: 100%;
        }

        .canvas-wrap[data-state="loading"] {
            height: var(--bamboo-height);
        }

        canvas {
            display: block;
            width: 100%;
        }

        [hidden] {
            display: none !important;
        }

        .handwritten-answer {
            min-height: 160px;
            margin-top: 30px;
            padding: 12px 16px 24px;
            color: var(--ink);
            font-family: var(--font-answer);
            font-style: var(--answer-style);
            font-weight: var(--answer-weight);
            font-size: var(--answer-size);
            line-height: var(--answer-line-height);
            text-align: var(--answer-align);
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .finish-answer {
            min-height: var(--touch-size);
            padding: 6px 0;
            border: 0;
            background: none;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: var(--font-controls-size);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* ─── Custom text panel ──────────────────── */
        .field {
            display: block;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 12px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input[type="text"].boxed,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--ink);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: 0.18s ease;
        }

        input[type="text"].boxed:focus,
        textarea:focus {
            border-color: var(--ink);
            box-shadow: 0 0 0 3px var(--focus);
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--touch-size);
            gap: 7px;
            padding: 9px 16px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: none;
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--ink);
        }

        .btn .lucide {
            width: var(--icon-size);
            height: var(--icon-size);
            stroke-width: 1.5;
        }

        .btn-solid {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--surface);
        }

        .btn-solid:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ─── AI model dialog ────────────────────── */
        .ai-dialog {
            position: fixed;
            top: calc(var(--viewport-top, 0px) + var(--viewport-height, 100dvh) / 2);
            bottom: auto;
            margin: 0 auto;
            transform: translateY(-50%);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px;
            max-width: 26rem;
            width: calc(100vw - 2rem);
            max-height: calc(100vh - 2rem);
            max-height: calc(var(--viewport-height, 100dvh) - 2rem);
            overflow-y: auto;
            overscroll-behavior: contain;
            scroll-padding-block: 16px 76px;
            background: var(--surface);
            color: var(--ink);
            font: inherit;
            font-family: var(--font-body);
        }

        .ai-dialog::backdrop {
            background: var(--backdrop);
        }

        .ai-dialog h2 {
            margin: 0 0 18px;
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 400;
        }

        .ai-dialog .field[hidden] {
            display: none;
        }

        .ai-dialog select,
        .ai-dialog input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: inherit;
            font: inherit;
            font-size: var(--input-size);
            min-height: var(--touch-size);
            outline: none;
        }

        .ai-dialog select:focus,
        .ai-dialog input:focus {
            border-color: var(--ink);
        }

        .ai-providers {
            display: flex;
            gap: 6px;
        }

        .ai-providers button {
            flex: 1;
            min-height: var(--touch-size);
            min-width: 0;
            padding: 8px 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: none;
            color: inherit;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .ai-providers button[aria-pressed="true"] {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--surface);
        }

        .ai-note {
            font-size: 12px;
            color: var(--muted);
            margin: 6px 0 0;
            overflow-wrap: anywhere;
        }

        .ai-note a {
            color: inherit;
        }

        .ai-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            position: sticky;
            bottom: -1px;
            padding-top: 8px;
            background: var(--surface);
        }

        button:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        button {
            touch-action: manipulation;
        }

        /* ─── Utility ────────────────────────────── */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            :root {
                --title-size: clamp(23px, 6vw, 26px);
                --question-size: clamp(19px, 4.8vw, 22px);
                --answer-size: clamp(32px, 8.2vw, 36px);
                --answer-line-height: 1.35;
                --bamboo-height: clamp(160px, 32svh, 240px);
            }

            .page {
                padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            }

            .topbar { gap: 8px; }
            .topbar-actions { gap: 2px; }

            .modes {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
                margin-top: 20px;
            }

            .mode-btn {
                justify-content: center;
                min-height: 52px;
                padding: 4px 0 8px;
            }

            .handwritten-answer {
                margin-top: 24px;
                padding: 8px 4px 20px;
            }

            input[type="text"].boxed,
            textarea { font-size: var(--input-size); }

            .ai-dialog {
                top: calc(var(--viewport-top, 0px) + max(12px, env(safe-area-inset-top)));
                transform: none;
                width: calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
                max-height: calc(var(--viewport-height, 100dvh) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                padding: 20px;
            }

            .row > .btn { flex: 1 1 auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-in { animation: none; }
            button { transition: none; }
        }
    </style>
</head>

<body>

    <main class="page">
        <div id="step-oracle" class="fade-in">
            <header class="topbar">
                <h1>Personal Zen</h1>
                <div class="topbar-actions">
                    <button type="button" class="icon-btn" id="btnModel" aria-haspopup="dialog"
                        title="Model settings" aria-label="Model settings">
                        <i data-lucide="eye" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="icon-btn" id="btnUploadCustom" title="Load custom text" aria-label="Load custom text">
                        <i data-lucide="file-plus-2"></i>
                    </button>
                </div>
            </header>

            <div class="modes" role="group" aria-label="Selection mode">
                <button type="button" class="mode-btn" id="modeBM25" aria-pressed="true">
                    <svg class="mode-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5.5 11C.5 9 2 3 6 3c3 0 5 2 5 4m10 0c0-2 2-4 5-4 4 0 5.5 6 .5 8" />
                        <path d="M5 8c-1-2 2-3 3-1m16 0c1-2 4-1 3 1" />
                        <path d="M16 6C9 6 4 10 4 18c0 7 5 11 12 11s12-4 12-11C28 10 23 6 16 6Z" />
                        <path d="M12 12c-3-1-6 3-5 6 1 3 5 3 6 0 1-2 1-5-1-6Zm8 0c3-1 6 3 5 6-1 3-5 3-6 0-1-2-1-5 1-6Z" />
                        <path d="M9 16c1-1 2-1 3 0m8 0c1-1 2-1 3 0m-9 5c1-1 3-1 4 0l-2 2-2-2Zm2 2v1m0 0c-1 2-3 1-4 0m4 0c1 2 3 1 4 0M7 21l1 1m17-1-1 1" />
                    </svg>Panda
                </button>
                <button type="button" class="mode-btn" id="modeAI" aria-pressed="false">
                    <svg class="mode-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 4c-1-3 5-3 4 0M12 7c0-5 8-5 8 0v3c0 5-8 5-8 0V7Z" />
                        <path d="M12 7c2 0 3-1 4-2 1 1 2 2 4 2M12 8c-3-2-3 5 0 5m8-5c3-2 3 5 0 5M13.5 9l1.5.5m3.5-.5-1.5.5m-2 2h2" />
                        <path d="M12 15c-4 1-4 6-7 8-3 2-2 5 2 5h18c4 0 5-3 2-5-3-2-3-7-7-8M13 15c0 4 3 6 6 7M11 19l-2 4 7 3 7-3-2-4" />
                        <path d="M13 23c1-2 5-2 6 0m-6 0h6m-3 3-7 2m7-2 7 2M6 30h20" />
                    </svg>Buddha
                </button>
                <button type="button" class="mode-btn" id="modeZen" aria-pressed="false"
                    title="Two Panda and two Buddha passages, then Buddha picks one">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 19C5 15 8 8 12 3c4 5 7 12 0 16Z" />
                        <path d="M9 17C4 16 3 12 3 8c3 0 5 1 6 3m6 6c5-1 6-5 6-9-3 0-5 1-6 3M12 19C6 21 2 18 1 14l4 1m7 4c6 2 10-1 11-5l-4 1" />
                    </svg>Zen
                </button>
            </div>

            <div class="ask" style="margin-top:22px;">
                <input type="text" id="queryInput" placeholder="What seeks an answer?" aria-label="Your question" enterkeyhint="send">
                <button type="button" id="btnConsult" title="Consult" aria-label="Consult">
                    <i data-lucide="arrow-right"></i>
                </button>
            </div>

            <div class="canvas-wrap" id="canvasContainer" data-state="idle" aria-busy="false">
                <canvas id="oracleCanvas"></canvas>
                <div id="handwrittenAnswer" class="handwritten-answer" role="img" hidden></div>
                <button id="btnFinishAnswer" class="finish-answer" type="button"
                    title="Show the full answer (Esc)" hidden>Show answer</button>
            </div>
            <span id="answerStatus" class="sr-only" role="status" aria-live="polite"></span>
            <p class="ai-note" id="status" role="status" aria-live="polite"></p>
        </div>

        <!-- Custom text -->
        <div id="step-upload" class="hidden">
            <header class="topbar" style="margin-bottom:24px;">
                <h1>Custom text</h1>
                <button type="button" class="icon-btn" id="btnCancelUpload" title="Back" aria-label="Back">
                    <i data-lucide="x"></i>
                </button>
            </header>
            <label class="field">
                <span>Title</span>
                <input type="text" class="boxed" id="docTitle" placeholder="e.g. Meditations by Marcus Aurelius">
            </label>
            <label class="field">
                <span>Source text</span>
                <textarea id="sourceText" placeholder="Paste the text you wish to consult…"></textarea>
            </label>
            <div class="row">
                <button type="button" class="btn" id="btnPickFile">
                    <i data-lucide="upload"></i>Upload .txt
                </button>
                <input type="file" id="fileInput" accept=".txt" hidden>
                <button type="button" class="btn btn-solid" id="btnLoadText" disabled>
                    <i data-lucide="check"></i>Load text
                </button>
            </div>
        </div>
    </main>

        const TEGAKI_URL = "https://cdn.jsdelivr.net/npm/tegaki@0.22.1/dist/core/index.mjs";
        const HANDWRITING_LOAD_TIMEOUT = 7000;

        // ─── State ───────────────────────────────────
        const state = {
            title: "Bob Dylan 1961-1980",
            text: "",
            mode: "bm25", // 'bm25' | 'ai' | 'zen'
            ai: loadAiSettings(),
            answerText: "",
            answerRevision: 0,
            requestRevision: 0,
            handwriting: null,
            handwritingPromise: null,
            animationId: null
        };

        // ─── DOM references ──────────────────────────
        const els = {
            stepUpload: document.getElementById("step-upload"),
            stepOracle: document.getElementById("step-oracle"),
            docTitle: document.getElementById("docTitle"),
            sourceText: document.getElementById("sourceText"),
            fileInput: document.getElementById("fileInput"),
            btnPickFile: document.getElementById("btnPickFile"),
            btnLoadText: document.getElementById("btnLoadText"),
            btnUploadCustom: document.getElementById("btnUploadCustom"),
            btnCancelUpload: document.getElementById("btnCancelUpload"),
            queryInput: document.getElementById("queryInput"),
            btnConsult: document.getElementById("btnConsult"),
            canvasContainer: document.getElementById("canvasContainer"),
            canvas: document.getElementById("oracleCanvas"),
            handwrittenAnswer: document.getElementById("handwrittenAnswer"),
            btnFinishAnswer: document.getElementById("btnFinishAnswer"),

            modeBM25: document.getElementById("modeBM25"),
            modeAI: document.getElementById("modeAI"),
            modeZen: document.getElementById("modeZen"),

            status: document.getElementById("status")

        const ctx = els.canvas.getContext("2d");
        const aiDialog = document.createElement("dialog");
        aiDialog.className = "ai-dialog";
        aiDialog.setAttribute("aria-labelledby", "aiDialogTitle");
        document.body.appendChild(aiDialog);

        // ─── Helpers: AI settings ────────────────────
        function defaultModelFor(providerId) {
            const p = AI_CATALOG.providers[providerId];
            return p.defaultModel || p.models[0];
        }

        function loadAiSettings() {
            const fallback = {
                provider: AI_CATALOG.defaultProvider,
                model: defaultModelFor(AI_CATALOG.defaultProvider),
                keys: { gemini: "", openai: "", claude: "" }
            };
            try {
                const raw = JSON.parse(localStorage.getItem(LS_AI) || "null");
                if (!raw || !AI_CATALOG.providers[raw.provider]) return fallback;
                return {
                    provider: raw.provider,
                    model: raw.model || defaultModelFor(raw.provider),
                    keys: { ...fallback.keys, ...(raw.keys || {}) }
                };
            } catch (e) {
                return fallback;
            }
        }

        function saveAiSettings() {
            cancelConsultation();
            try {
                localStorage.setItem(LS_AI, JSON.stringify(state.ai));
            } catch (e) { /* private mode: settings simply do not persist */ }
            renderModelButton();
        }

        // Groups a provider's curated models by capability tier; anything the
        // tier patterns do not claim falls into "other" so nothing disappears.
        function groupModels(providerId) {
            const p = AI_CATALOG.providers[providerId];
            const groups = new Map();
            for (const model of p.models) {
                const tier = (p.tiers.find(t => t.test.test(model)) || { id: "other" }).id;
                if (!groups.has(tier)) groups.set(tier, []);
                groups.get(tier).push(model);
            }
            return [...groups.entries()];
        }

        function currentKey() {
            return (state.ai.keys[state.ai.provider] || "").trim();
        }

        // ─── Helpers: provider requests ──────────────
        // Each builder returns {url, headers, body}; each extractor pulls the
        // text out of that provider's non-streaming response shape.
        const PROVIDER_REQUESTS = {
            gemini: {
                build: ({ key, model, prompt }) => {
                    const sampling = AI_CATALOG.providers.gemini.samplingSupported.includes(model)
                        ? { generationConfig: { temperature: 0.7, maxOutputTokens: MAX_OUTPUT_TOKENS } }
                        : { generationConfig: { maxOutputTokens: MAX_OUTPUT_TOKENS } };
                    return {
                        url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
                        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
                        body: { contents: [{ parts: [{ text: prompt }] }], ...sampling }
                    };
                },
                extract: data => data.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join("") || ""
            },
            openai: {
                build: ({ key, model, prompt }) => ({
                    url: "https://api.openai.com/v1/responses",
                    headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
                    body: { model, input: [{ role: "user", content: [{ type: "input_text", text: prompt }] }] }
                }),
                extract: data => {
                    if (typeof data.output_text === "string" && data.output_text) return data.output_text;
                    return (data.output || [])
                        .flatMap(item => item.content || [])
                        .filter(part => part.type === "output_text")
                        .map(part => part.text)
                        .join("");
                }
            },
            claude: {
                build: ({ key, model, prompt }) => {
                    const optional = AI_CATALOG.providers.claude.thinkingOptional.includes(model);
                    return {
                        url: "https://api.anthropic.com/v1/messages",
                        headers: {
                            "Content-Type": "application/json",
                            "x-api-key": key,
                            "anthropic-version": "2023-06-01",
                            "anthropic-dangerous-direct-browser-access": "true"
                        },
                        body: {
                            model,
                            max_tokens: MAX_OUTPUT_TOKENS,
                            ...(optional ? { thinking: { type: "disabled" } } : {}),
                            messages: [{ role: "user", content: [{ type: "text", text: prompt }] }]
                        }
                    };
                },
                extract: data => (data.content || []).filter(b => b.type === "text").map(b => b.text).join("")
            }
        };

        function providerErrorMessage(data, res) {
            const msg = data?.error?.message || data?.error?.type || data?.message;
            return msg || `HTTP ${res.status}`;
        }

        // ─── Helpers: text ───────────────────────────
        function getRandomParagraphs(text, count = 50) {
            const paragraphs = text
                .split(/\n\n+|\n(?=[A-Z])/)
                .map(p => p.trim())
                .filter(p => p.length > 20 && p.length < 500);

            if (paragraphs.length <= count) return paragraphs;

            const shuffled = [...paragraphs];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, count);
        }

        function buildOraclePrompt(query) {
            const retrievedContext = getRandomParagraphs(state.text, 50).join("\n\n---\n\n");
            return `You are given a collection of text (eg. parts of books, lyrics, etc.). When the user asks a question, select 2-3 consecutive lines that feel mysteriously relevant.

TEXT CONTEXT:
${retrievedContext}

USER QUESTION: "${query}"

SELECTION PRINCIPLES:
- Prioritize emotional resonance
- Favor imagery over statements

MATCHING HEURISTICS:
- Try to match the tone and the topic of the question, it shouldn't sound too random.

OUTPUT FORMAT:
- ALWAYS return 2-3 consecutive lines, never just one line
- Quote the lines exactly as written, each on its own line
- No explanation, no commentary`;
        }

        // Zen mode, step 1: the model proposes its own candidates. It answers
        // in JSON so the passages arrive as separate strings instead of one
        // blob that would have to be split on guesswork.
        function buildCandidatesPrompt(query, count) {
            const retrievedContext = getRandomParagraphs(state.text, 50).join("\n\n---\n\n");
            return `You are given a collection of text (eg. parts of books, lyrics, etc.). When the user asks a question, select ${count} DIFFERENT passages of 2-3 consecutive lines that feel mysteriously relevant.

TEXT CONTEXT:
${retrievedContext}

USER QUESTION: "${query}"

SELECTION PRINCIPLES:
- Prioritize emotional resonance
- Favor imagery over statements
- The ${count} passages must come from different places in the text

OUTPUT FORMAT:
- Reply with JSON only: {"passages": ["...", "..."]}
- Each passage is 2-3 consecutive lines, quoted exactly as written, lines separated by \\n
- No explanation, no commentary, no code fences`;
        }

        // Zen mode, step 2: the model only picks an index. The passage that
        // gets drawn is the one already in hand, so the wording on screen is
        // always the source text and never a paraphrase.
        function buildJudgePrompt(query, candidates) {
            const list = candidates
                .map((c, i) => `[${i + 1}]\n${c.text}`)
                .join("\n\n");
            return `A person asked an oracle a question. Below are ${candidates.length} candidate passages drawn from one text.

USER QUESTION: "${query}"

CANDIDATES:
${list}

Choose the single passage that answers the question most resonantly: emotional truth over literal match, imagery over statement.

OUTPUT FORMAT:
- Reply with JSON only: {"choice": <number>}
- The number is the index shown in square brackets
- No explanation, no commentary, no code fences`;
        }

        // Model output is never evaluated, only parsed. Fences and any prose
        // around the object are trimmed before JSON.parse sees it.
        function parseModelJson(text) {
            const cleaned = String(text).replace(/```(?:json)?/gi, "").trim();
            const start = cleaned.search(/[[{]/);
            if (start === -1) return null;
            const end = Math.max(cleaned.lastIndexOf("}"), cleaned.lastIndexOf("]"));
            if (end <= start) return null;
            try {
                return JSON.parse(cleaned.slice(start, end + 1));
            } catch (e) {
                return null;
            }
        }

        async function callFreeModel(model, prompt) {
            const res = await fetch(FREE_MODEL_WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }] })
            });
            let data = null;
            try {
                data = await res.json();
            } catch (e) { /* non-JSON error body */ }
            if (!res.ok || data?.error) throw new Error(providerErrorMessage(data, res));
            return data?.choices?.[0]?.message?.content || "";
        }

        async function callModel(prompt) {
            const { provider, model } = state.ai;
            if (isFreeModel(provider, model)) return callFreeModel(model, prompt);

            const spec = PROVIDER_REQUESTS[provider];
            const { url, headers, body } = spec.build({ key: currentKey(), model, prompt });

            const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
            let data = null;
            try {
                data = await res.json();
            } catch (e) { /* non-JSON error body */ }
            if (!res.ok || data?.error) throw new Error(providerErrorMessage(data, res));
            return spec.extract(data) || "";
        }

        async function fetchPassageAI(query) {
            return (await callModel(buildOraclePrompt(query))) || "No passage found.";
        }

        async function fetchCandidatesAI(query, count) {
            const parsed = parseModelJson(await callModel(buildCandidatesPrompt(query, count)));
            const list = Array.isArray(parsed) ? parsed : parsed?.passages;
            if (!Array.isArray(list)) return [];
            return list
                .map(p => (typeof p === "string" ? p : p?.text || ""))
                .map(p => p.trim())
                .filter(Boolean)
                .slice(0, count);
        }

        // ─── Zen mode ────────────────────────────────
        // Step 1 gathers two BM25 passages and two AI passages, step 2 has the
        // model pick one of the four. BM25 runs first and locally, so a failing
        // step 1 still leaves something to show.
        async function consultZen(query, onProgress) {
            const candidates = bm25TopPassages(query, 2).map(text => ({ text, source: "BM25" }));

            onProgress("Meditating…");
            let aiFailed = "";
            try {
                for (const text of await fetchCandidatesAI(query, 2)) {
                    candidates.push({ text, source: "AI" });
                }
            } catch (e) {
                aiFailed = e.message;
            }

            // Two runs can land on the same lines; showing the same passage
            // twice would make the choice look rigged.
            const pool = [];
            const seen = new Set();
            for (const c of candidates) {
                const fingerprint = c.text.replace(/\s+/g, " ").toLowerCase();
                if (seen.has(fingerprint)) continue;
                seen.add(fingerprint);
                pool.push(c);
            }

            if (pool.length === 0) throw new Error(aiFailed || "No passages found.");
            if (pool.length === 1) {
                return { passage: pool[0].text, note: aiFailed ? `AI step failed: ${aiFailed}` : "" };
            }

            onProgress("Wisdoming…");
            let chosen = pool[0];
            let judgeFailed = aiFailed;
            try {
                const parsed = parseModelJson(await callModel(buildJudgePrompt(query, pool)));
                const index = Number(parsed?.choice) - 1;
                if (Number.isInteger(index) && pool[index]) chosen = pool[index];
            } catch (e) {
                judgeFailed = e.message;
            }
            return { passage: chosen.text, note: judgeFailed ? `AI step failed: ${judgeFailed}` : "" };
        }


        // ─── BM25 ────────────────────────────────────
        // Ranks every 2-3 line window against the query and returns the whole
        // sorted list; the callers decide how many of them they want.
        function bm25Rank(query) {
            const k1 = 1.5;
            const b = 0.75;
            const tokenize = text => text.toLowerCase().match(/\b\w+\b/g) || [];

            const lines = state.text.split("\n").filter(l => l.trim() && !l.startsWith("Title:") && l !== "---");
            const passages = [];
            for (let i = 0; i < lines.length - 1; i++) {
                const numLines = 2 + Math.floor(Math.random() * 2); // 2 or 3 lines
                const passageLines = lines.slice(i, i + numLines);
                if (passageLines.length >= 2) passages.push(passageLines.join("\n"));
            }
            if (passages.length === 0) return { passages: [], scores: [] };

            const docLengths = passages.map(p => tokenize(p).length);
            const avgDocLength = docLengths.reduce((a, b2) => a + b2, 0) / docLengths.length;

            const queryTokens = tokenize(query);
            const N = passages.length;
            const idf = {};
            for (const term of queryTokens) {
                const docsWithTerm = passages.filter(p => tokenize(p).includes(term)).length;
                idf[term] = Math.log((N - docsWithTerm + 0.5) / (docsWithTerm + 0.5) + 1);
            }

            const scores = passages.map((passage, idx) => {
                const tokens = tokenize(passage);
                const termFreq = {};
                tokens.forEach(t => termFreq[t] = (termFreq[t] || 0) + 1);

                let score = 0;
                for (const term of queryTokens) {
                    const tf = termFreq[term] || 0;
                    const docLen = docLengths[idx];
                    score += (idf[term] || 0) * ((tf * (k1 + 1)) / (tf + k1 * (1 - b + b * (docLen / avgDocLength))));
                }
                return { passage, score };
            });

            scores.sort((a, b2) => b2.score - a.score);
            return { passages, scores };
        }

        function bm25Search(query) {
            const { passages, scores } = bm25Rank(query);
            if (passages.length === 0) return "No passages found.";

            const topScores = scores.slice(0, Math.min(10, scores.length)).filter(s => s.score > 0);
            if (topScores.length === 0) return passages[Math.floor(Math.random() * passages.length)];

            const randomTop = Math.floor(Math.random() * Math.min(3, topScores.length));
            return topScores[randomTop].passage;
        }

        // The top n scoring passages, overlapping windows folded together: the
        // windows slide one line at a time, so the runners-up are usually the
        // same lines shifted by one and would fill the pool with near-copies.
        function bm25TopPassages(query, n) {
            const { passages, scores } = bm25Rank(query);
            if (passages.length === 0) return [];

            const picked = [];
            const usedLines = new Set();
            const ranked = scores.filter(s => s.score > 0);

            for (const { passage } of ranked) {
                const lines = passage.split("\n").map(l => l.trim().toLowerCase());
                if (lines.some(l => usedLines.has(l))) continue;
                lines.forEach(l => usedLines.add(l));
                picked.push(passage);
                if (picked.length === n) return picked;
            }

            // Nothing matched, or the matches all overlapped: top up at random.
            while (picked.length < n && picked.length < passages.length) {
                const candidate = passages[Math.floor(Math.random() * passages.length)];
                if (!picked.includes(candidate)) picked.push(candidate);
            }
            return picked;
        }

        // ─── Render: model settings ──────────────────
        function renderModelButton() {
            els.btnModel.title = `${AI_CATALOG.providers[state.ai.provider].label} · ${state.ai.model}`;
        }

        function fitSettingsViewport() {
            const viewport = window.visualViewport;
            if (viewport && viewport.scale !== 1) return;
            aiDialog.style.setProperty("--viewport-height", `${viewport?.height ?? window.innerHeight}px`);
            aiDialog.style.setProperty("--viewport-top", `${viewport?.offsetTop ?? 0}px`);
            if (!aiDialog.open) return;
            requestAnimationFrame(() => {
                const focused = document.activeElement;
                if (!aiDialog.open || !aiDialog.contains(focused) || focused === aiDialog) return;
                const bounds = aiDialog.getBoundingClientRect();
                const field = focused.getBoundingClientRect();
                const footer = aiDialog.querySelector(".ai-actions");
                const bottom = footer.contains(focused) ? bounds.bottom - 20 : footer.getBoundingClientRect().top - 12;
                if (field.bottom > bottom) aiDialog.scrollTop += field.bottom - bottom;
                else if (field.top < bounds.top + 20) aiDialog.scrollTop -= bounds.top + 20 - field.top;
            });
        }

        function renderAiDialog() {
            const info = AI_CATALOG.providers[state.ai.provider];
            const isCustom = !info.models.includes(state.ai.model);

            aiDialog.innerHTML = `
                <h2 id="aiDialogTitle">AI model</h2>
                <div class="field">
                    <label>Provider</label>
                    <div class="ai-providers" role="group" aria-label="Provider"></div>
                </div>
                <div class="field">
                    <label for="aiModelSelect">Model</label>
                    <select id="aiModelSelect"></select>
                </div>
                <div class="field ai-custom" ${isCustom ? "" : "hidden"}>
                    <label for="aiModelCustom">Model ID</label>
                    <input id="aiModelCustom" type="text" spellcheck="false" autocomplete="off">
                </div>
                <div class="field">
                    <label for="aiKey">API key · ${info.label}</label>
                    <input id="aiKey" type="password" autocomplete="off" spellcheck="false"
                        placeholder="${info.keyPlaceholder}">
                    <p class="ai-note">The key stays in this browser (localStorage) and is sent only to the
                        selected provider. Generate one at
                        <a href="${info.keyUrl}" target="_blank" rel="noopener">${info.keyUrl.replace("https://", "")}</a>.</p>
                </div>
                <div class="ai-actions"><button type="button" class="btn ai-close">Close</button></div>`;

            const providersEl = aiDialog.querySelector(".ai-providers");
            for (const [id, p] of Object.entries(AI_CATALOG.providers)) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = p.label;
                btn.setAttribute("aria-pressed", String(id === state.ai.provider));
                btn.addEventListener("click", () => {
                    if (id === state.ai.provider) return;
                    state.ai.provider = id;
                    state.ai.model = defaultModelFor(id);
                    saveAiSettings();
                    renderAiDialog();
                });
                providersEl.appendChild(btn);
            }

            const select = aiDialog.querySelector("#aiModelSelect");
            const customField = aiDialog.querySelector(".ai-custom");
            const customInput = aiDialog.querySelector("#aiModelCustom");

            for (const [tier, models] of groupModels(state.ai.provider)) {
                const group = document.createElement("optgroup");
                group.label = TIER_LABELS[tier] || tier;
                for (const model of models) {
                    const opt = document.createElement("option");
                    opt.value = model;
                    opt.textContent = model;
                    group.appendChild(opt);
                }
                select.appendChild(group);
            }
            const customOpt = document.createElement("option");
            customOpt.value = CUSTOM_MODEL;
            customOpt.textContent = "custom model…";
            select.appendChild(customOpt);

            select.value = isCustom ? CUSTOM_MODEL : state.ai.model;
            customInput.value = isCustom ? state.ai.model : "";

            select.addEventListener("change", () => {
                if (select.value === CUSTOM_MODEL) {
                    customField.hidden = false;
                    customInput.focus();
                    if (customInput.value.trim()) state.ai.model = customInput.value.trim();
                } else {
                    customField.hidden = true;
                    state.ai.model = select.value;
                }
                saveAiSettings();
            });

            customInput.addEventListener("input", () => {
                const value = customInput.value.trim();
                if (value) {
                    state.ai.model = value;
                    saveAiSettings();
                }
            });

            const keyInput = aiDialog.querySelector("#aiKey");
            keyInput.value = state.ai.keys[state.ai.provider] || "";
            keyInput.addEventListener("input", () => {
                state.ai.keys[state.ai.provider] = keyInput.value.trim();
                saveAiSettings();
            });

            aiDialog.querySelector(".ai-close").addEventListener("click", () => aiDialog.close());
        }

        // ─── Render: mode + canvas ───────────────────
        function setMode(mode) {
            if (state.mode !== mode) cancelConsultation();
            state.mode = mode;
            els.modeBM25.setAttribute("aria-pressed", String(mode === "bm25"));
            els.modeAI.setAttribute("aria-pressed", String(mode === "ai"));
            els.modeZen.setAttribute("aria-pressed", String(mode === "zen"));
            // Both AI-backed modes are dead without a key, so say so up front
            // rather than on the first consult.
            els.status.textContent = mode !== "bm25" && !currentKey() && !isFreeModel(state.ai.provider, state.ai.model)
                ? `Add your ${AI_CATALOG.providers[state.ai.provider].label} API key in the model settings.`
                : "";
        }

        function inkColor() {
            return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#17161a";
        }

        function setupCanvas(height = 400) {
            const dpr = window.devicePixelRatio || 1;
            const rect = els.canvasContainer.getBoundingClientRect();
            els.canvas.width = rect.width * dpr;
            els.canvas.height = height * dpr;
            els.canvas.style.width = "100%";
            els.canvas.style.height = height + "px";
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            return { width: rect.width, height };
        }

        function bambooMotionOffset(time, progress, phase) {
            const t = Math.max(0, Math.min(1, Number.isFinite(progress) ? progress : 0));
            if (t === 0) return 0;
            const delayedTime = (Number.isFinite(time) ? time : 0) - t * 0.82;
            const eased = t * t * (3 - 2 * t);
            const slowSway = Math.sin(delayedTime * 0.78 + phase) * 13.5;
            const elasticSway = Math.sin(delayedTime * 1.42 + phase * 0.7) * 4;
            const springSway = Math.sin(delayedTime * 2.05 + phase * 1.3) * 1.5;
            return eased * (slowSway + elasticSway + springSway);
        }

        function bambooStalkGeometry(stalk, width, height, time, reducedMotion = false) {
            const baseX = width / 2 + stalk.x;
            const baseY = height - 34;
            const frameTime = reducedMotion ? 0 : (Number.isFinite(time) ? time : 0);
            const segments = 10;
            const centerline = [];
            const leftEdge = [];
            const rightEdge = [];

            for (let segment = 0; segment <= segments; segment++) {
                const progress = segment / segments;
                const x = baseX + stalk.lean * progress
                    + bambooMotionOffset(frameTime, progress, stalk.phase);
                const y = baseY - stalk.height * progress;
                const edgeWidth = 2.4 - progress * 0.7;
                centerline.push({ x, y });
                leftEdge.push({ x: x - edgeWidth, y });
                rightEdge.push({ x: x + edgeWidth, y });
            }

            const tip = centerline[centerline.length - 1];
            return {
                centerline,
                leftEdge,
                rightEdge,
                tipDisplacement: tip.x - (baseX + stalk.lean)
            };
        }

        function bambooLoadingViewport() {
            const designWidth = 320;
            const designHeight = 280;
            const rect = els.canvasContainer.getBoundingClientRect();
            const width = Number.isFinite(rect.width) && rect.width > 0 ? rect.width : designWidth;
            const height = Number.isFinite(rect.height) && rect.height > 0 ? rect.height : designHeight;
            const scale = Math.min(1, width / designWidth, height / designHeight);
            return { width, height, scale };
        }

        function startLoadingAnimation() {
            stopAnswerAnimation();
            els.canvasContainer.style.display = "block";
            if (state.animationId) cancelAnimationFrame(state.animationId);
            state.animationId = null;
            els.canvasContainer.dataset.state = "loading";
            els.canvasContainer.dataset.animation = "bamboo";
            els.canvasContainer.setAttribute("aria-busy", "true");
            els.canvas.setAttribute("aria-label", "Bamboo swaying in the wind while the answer is prepared");
            els.status.textContent = "Listening…";

            const designHeight = 280;
            let { width, height, scale } = bambooLoadingViewport();
            function applyLoadingViewport(viewport) {
                const configured = setupCanvas(viewport.height);
                width = configured.width;
                height = configured.height;
                scale = viewport.scale;
                ctx.scale(scale, scale);
                els.canvasContainer.dataset.loadingWidth = String(width);
                els.canvasContainer.dataset.loadingHeight = String(height);
                els.canvasContainer.dataset.loadingScale = String(scale);
            }
            applyLoadingViewport({ width, height, scale });
            const stroke = inkColor();
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
            const startedAt = performance.now();
            const stalks = [
                { x: -38, height: 163, lean: -10, phase: 0.4 },
                { x: 0, height: 204, lean: 3, phase: 0 },
                { x: 37, height: 145, lean: 12, phase: 0.8 }
            ];

            function drawBamboo(timestamp) {
                state.animationId = null;
                const viewport = bambooLoadingViewport();
                if (viewport.width !== width || viewport.height !== height) {
                    applyLoadingViewport(viewport);
                }
                const time = reducedMotion.matches ? 0 : (timestamp - startedAt) / 1000;
                ctx.clearRect(0, 0, width / scale, height / scale);
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 1;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                for (const stalk of stalks) {
                    const geometry = bambooStalkGeometry(stalk, width / scale, designHeight, time, reducedMotion.matches);
                    ctx.globalAlpha = 0.65;

                    for (const edge of [geometry.leftEdge, geometry.rightEdge]) {
                        ctx.beginPath();
                        ctx.moveTo(edge[0].x, edge[0].y);
                        for (let pointIndex = 1; pointIndex < edge.length - 1; pointIndex++) {
                            const point = edge[pointIndex];
                            const next = edge[pointIndex + 1];
                            ctx.quadraticCurveTo(
                                point.x,
                                point.y,
                                (point.x + next.x) / 2,
                                (point.y + next.y) / 2
                            );
                        }
                        const last = edge[edge.length - 1];
                        ctx.quadraticCurveTo(last.x, last.y, last.x, last.y);
                        ctx.stroke();
                    }

                    for (let node = 1; node <= 5; node++) {
                        const progress = node / 5;
                        const point = geometry.centerline[Math.round(progress * 10)];
                        const x = point.x;
                        const y = point.y;
                        ctx.beginPath();
                        ctx.moveTo(x - 3.5, y);
                        ctx.quadraticCurveTo(x, y - 1.5, x + 3.5, y);
                        ctx.stroke();
                        if (node < 2 || node > 4) continue;

                        const side = stalk.x < 0 ? -1 : stalk.x > 0 ? 1 : node % 2 ? -1 : 1;
                        const delayedBranchTime = Math.max(0, time - 0.18);
                        const branchSway = bambooMotionOffset(delayedBranchTime, progress, stalk.phase) * 0.16;
                        const endX = x + side * 31 + branchSway;
                        const endY = y - 12 + Math.sin(delayedBranchTime * 0.85 + node) * 0.8;
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.quadraticCurveTo(
                            x + side * 15 + branchSway * 0.45,
                            y - 10,
                            endX,
                            endY
                        );
                        ctx.stroke();

                        const leaves = [
                            { at: 0.4, dx: side * 13, dy: -25 },
                            { at: 0.7, dx: side * 25, dy: -12 },
                            { at: 0.85, dx: side * 21, dy: 13 }
                        ];
                        for (const leaf of leaves) {
                            const fromX = x + (endX - x) * leaf.at;
                            const fromY = y + (endY - y) * leaf.at - 2;
                            const leafTime = Math.max(0, time - 0.34 - leaf.at * 0.08);
                            const leafSway = Math.sin(leafTime * 1.35 + node + stalk.phase) * 2.4;
                            const tipX = fromX + leaf.dx + leafSway;
                            const tipY = fromY + leaf.dy + Math.cos(leafTime * 1.1 + node) * 1.1;
                            const midX = (fromX + tipX) / 2;
                            const midY = (fromY + tipY) / 2;
                            const length = Math.hypot(tipX - fromX, tipY - fromY) || 1;
                            const normalX = -(tipY - fromY) / length * 3;
                            const normalY = (tipX - fromX) / length * 3;
                            ctx.beginPath();
                            ctx.moveTo(fromX, fromY);
                            ctx.quadraticCurveTo(midX + normalX, midY + normalY, tipX, tipY);
                            ctx.quadraticCurveTo(midX - normalX, midY - normalY, fromX, fromY);
                            ctx.stroke();
                        }
                    }
                }
                ctx.globalAlpha = 1;
                if (!reducedMotion.matches) state.animationId = requestAnimationFrame(drawBamboo);
            }
            drawBamboo(startedAt);
        }

        function answerTypography() {
            const style = getComputedStyle(els.handwrittenAnswer);
            return {
                font: `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`,
                lineHeight: parseFloat(style.lineHeight),
                align: style.textAlign
            };
        }

        function cancelConsultation(clearAnswer = false) {
            state.requestRevision++;
            if (!clearAnswer && els.canvasContainer.dataset.state !== "loading") return;
            stopAnswerAnimation();
            els.canvasContainer.dataset.state = "idle";
            delete els.canvasContainer.dataset.animation;
            els.canvasContainer.setAttribute("aria-busy", "false");
            els.canvasContainer.style.display = "none";
            els.status.textContent = "";
            els.answerStatus.textContent = "";
            if (clearAnswer) state.answerText = "";
        }

        function stopAnswerAnimation() {
            state.answerRevision++;
            if (state.animationId) cancelAnimationFrame(state.animationId);
            state.animationId = null;
            if (state.handwriting) state.handwriting.destroy();
            state.handwriting = null;
            els.handwrittenAnswer.replaceChildren();
            els.handwrittenAnswer.hidden = true;
            els.btnFinishAnswer.hidden = true;
            els.canvas.hidden = false;
            delete els.canvasContainer.dataset.renderer;
            delete els.canvasContainer.dataset.writing;
            delete els.canvasContainer.dataset.progress;
        }

        function loadHandwriting() {
            if (!state.handwritingPromise) {
                let timeoutId;
                const ready = import(TEGAKI_URL).then(async module => {
                    const data = JSON.parse(document.getElementById("handwritingFontData").textContent);
                    const bundle = module.createBundle(data);
                    await module.ensureFontFace(bundle);
                    return { TegakiEngine: module.TegakiEngine, bundle };
                });
                const timeout = new Promise((_, reject) => {
                    timeoutId = setTimeout(() => reject(new Error("Handwriting library timed out")), HANDWRITING_LOAD_TIMEOUT);
                });
                state.handwritingPromise = Promise.race([ready, timeout]).finally(() => clearTimeout(timeoutId));
            }
            return state.handwritingPromise;
        }

        function completeAnswer() {
            if (els.canvasContainer.dataset.state !== "answer") return;
            if (state.animationId) cancelAnimationFrame(state.animationId);
            state.animationId = null;
            if (state.handwriting) {
                state.handwriting.update({ time: state.handwriting.duration });
            } else {
                // Skipping during a slow CDN load must not wait for that load.
                state.answerRevision++;
                els.handwrittenAnswer.textContent = state.answerText;
                els.canvasContainer.dataset.renderer = "fallback";
            }
            els.canvasContainer.dataset.writing = "complete";
            els.canvasContainer.dataset.progress = "1";
            els.canvasContainer.setAttribute("aria-busy", "false");
            els.btnFinishAnswer.hidden = true;
            els.answerStatus.textContent = "Answer ready";
        }

        function renderAnswer(text) {
            stopAnswerAnimation();
            const revision = state.answerRevision;
            state.answerText = String(text);
            els.canvasContainer.style.display = "block";
            els.canvasContainer.dataset.state = "answer";
            els.canvasContainer.dataset.renderer = "pending";
            els.canvasContainer.dataset.writing = "preparing";
            els.canvasContainer.dataset.progress = "0";
            delete els.canvasContainer.dataset.animation;
            els.canvasContainer.setAttribute("aria-busy", "true");
            els.canvas.hidden = true;
            els.handwrittenAnswer.hidden = false;
            els.handwrittenAnswer.setAttribute("aria-label", state.answerText);
            els.btnFinishAnswer.hidden = false;
            els.answerStatus.textContent = "Writing answer";

            loadHandwriting().then(({ TegakiEngine, bundle }) => {
                if (revision !== state.answerRevision) return;
                const engine = new TegakiEngine(els.handwrittenAnswer, {
                    text: state.answerText,
                    font: bundle,
                    time: 0,
                    effects: { pressureWidth: true }
                });
                state.handwriting = engine;
                els.canvasContainer.dataset.renderer = "tegaki";
                els.canvasContainer.dataset.writing = "writing";
                const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
                if (reducedMotion.matches || !engine.duration) {
                    completeAnswer();
                    return;
                }
                const style = getComputedStyle(document.documentElement);
                const charactersPerSecond = Number(style.getPropertyValue("--answer-characters-per-second"));
                const maximumSeconds = Number(style.getPropertyValue("--answer-writing-seconds-max"));
                const seconds = Math.min(maximumSeconds, Math.max(2.5, [...state.answerText].length / charactersPerSecond));
                const startedAt = performance.now();
                function writeFrame(timestamp) {
                    state.animationId = null;
                    if (revision !== state.answerRevision) return;
                    const progress = Math.min(1, (timestamp - startedAt) / (seconds * 1000));
                    if (progress >= 1 || reducedMotion.matches) {
                        completeAnswer();
                        return;
                    }
                    engine.update({ time: progress * engine.duration });
                    els.canvasContainer.dataset.progress = progress.toFixed(3);
                    state.animationId = requestAnimationFrame(writeFrame);
                }
                state.animationId = requestAnimationFrame(writeFrame);
            }).catch(() => {
                if (revision !== state.answerRevision) return;
                if (state.handwriting) state.handwriting.destroy();
                state.handwriting = null;
                completeAnswer();
            });
        }

        // ─── Listeners ───────────────────────────────
        els.modeBM25.addEventListener("click", () => setMode("bm25"));
        els.modeAI.addEventListener("click", () => setMode("ai"));
        els.modeZen.addEventListener("click", () => setMode("zen"));

        els.btnModel.addEventListener("click", () => {
            renderAiDialog();
            fitSettingsViewport();
            aiDialog.showModal();
        });
        aiDialog.addEventListener("close", () => setMode(state.mode));
        window.visualViewport?.addEventListener("resize", fitSettingsViewport);
        window.visualViewport?.addEventListener("scroll", fitSettingsViewport);

        els.btnUploadCustom.addEventListener("click", () => {
            cancelConsultation();
            if (els.canvasContainer.dataset.state === "answer") completeAnswer();
            els.stepOracle.classList.add("hidden");
            els.stepUpload.classList.remove("hidden");
            els.stepUpload.classList.add("fade-in");
        });

        els.btnCancelUpload.addEventListener("click", () => {
            els.stepUpload.classList.add("hidden");
            els.stepOracle.classList.remove("hidden");
        });

        els.btnPickFile.addEventListener("click", () => els.fileInput.click());

        els.sourceText.addEventListener("input", () => {
            els.btnLoadText.disabled = !els.sourceText.value.trim();
        });

        els.fileInput.addEventListener("change", e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                els.sourceText.value = ev.target.result;
                els.docTitle.value = file.name.replace(/\.txt$/i, "");
                els.btnLoadText.disabled = false;
            };
            reader.readAsText(file);
        });

        els.btnLoadText.addEventListener("click", () => {
            cancelConsultation(true);
            state.text = els.sourceText.value;
            state.title = els.docTitle.value || "Untitled Text";
            els.stepUpload.classList.add("hidden");
            els.stepOracle.classList.remove("hidden");
        });

        els.queryInput.addEventListener("keydown", e => {
            if (e.key === "Enter") els.btnConsult.click();
        });

        window.addEventListener("resize", () => {
            fitSettingsViewport();
            if (els.canvasContainer.dataset.state === "loading" && state.animationId === null) startLoadingAnimation();
        });

        els.btnFinishAnswer.addEventListener("click", completeAnswer);
        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && !aiDialog.open && els.canvasContainer.dataset.writing !== "complete") completeAnswer();
        });

        els.btnConsult.addEventListener("click", async () => {
            const query = els.queryInput.value.trim();
            if (!query) return;
            const requestRevision = ++state.requestRevision;
            if (!state.text) {
                renderAnswer("No text loaded. Please upload a text file.");
                return;
            }

            els.status.textContent = "";
            startLoadingAnimation();

            try {
                let passage;
                let note = "";
                if (state.mode === "bm25") {
                    passage = bm25Search(query);
                } else {
                    const info = AI_CATALOG.providers[state.ai.provider];
                    if (!currentKey() && !isFreeModel(state.ai.provider, state.ai.model)) {
                        throw new Error(`Add your ${info.label} API key in the model settings.`);
                    }
                    if (state.mode === "zen") {
                        const result = await consultZen(query, step => {
                            if (requestRevision !== state.requestRevision) throw new Error("Consultation cancelled");
                            els.status.textContent = step;
                        });
                        passage = result.passage;
                        note = result.note;
                    } else {
                        passage = await fetchPassageAI(query);
                    }
                }
                if (requestRevision !== state.requestRevision) return;
                renderAnswer(passage);
                els.status.textContent = note;
            } catch (e) {
                if (requestRevision !== state.requestRevision) return;
                renderAnswer("The Oracle is silent.");
                els.status.textContent = e.message;
            }
        });

        // ─── Init ────────────────────────────────────
        async function init() {
            renderModelButton();
            setMode(state.mode);
            loadHandwriting().catch(() => { /* Answers stay readable if the CDN is unavailable. */ });
            document.fonts.load(answerTypography().font).catch(() => {});
            try {
                const response = await fetch("dylan_1961_1980.txt");
                if (!response.ok) throw new Error("File not found");
                state.text = await response.text();
            } catch (e) {
                els.status.textContent = "No text loaded. Please upload a text file.";
                console.error("Could not load default file:", e);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) lucide.createIcons();
        });
        init();
    </script>
</body>

</html>
